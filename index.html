<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contexto</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #18181b; }

    .root {
      min-height: 100vh;
      background: #18181b;
      font-family: 'DM Mono', monospace;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 100px;
    }
    .header {
      width: 100%; max-width: 500px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 40px 0 32px;
      border-bottom: 1px solid #2d2d30;
    }
    .title { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.5px; color: #f4f4f5; }
    .title em { font-style: italic; color: #52525b; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .diff-badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 4px; border: 1px solid; font-family: 'DM Mono', monospace; }
    .new-btn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #71717a; text-transform: uppercase; background: none; border: 1px solid #3f3f46; border-radius: 5px; padding: 6px 11px; cursor: pointer; transition: color .15s, border-color .15s; }
    .new-btn:hover { color: #e4e4e7; border-color: #71717a; }
    .new-btn:disabled { opacity: .25; cursor: default; }
    .body { width: 100%; max-width: 500px; padding-top: 32px; }

    .select-screen { padding: 32px 0 0; }
    .select-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: #a1a1aa; margin-bottom: 6px; }
    .select-sub { font-size: 11px; color: #52525b; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 32px; }
    .diff-cards { display: flex; flex-direction: column; gap: 10px; }
    .diff-card { background: #1f1f23; border: 1px solid #2d2d30; border-radius: 9px; padding: 18px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: border-color .15s, background .15s; }
    .diff-card:hover { background: #27272a; border-color: #52525b; }
    .dc-name { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 4px; }
    .dc-desc { font-size: 11px; color: #71717a; letter-spacing: .04em; }
    .dc-arrow { font-size: 18px; color: #3f3f46; }

    .input-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .inp { flex: 1; font-family: 'DM Mono', monospace; font-size: 14px; color: #e4e4e7; background: #1f1f23; border: 1px solid #3f3f46; border-radius: 7px; padding: 11px 14px; outline: none; transition: border-color .15s; }
    .inp::placeholder { color: #3f3f46; }
    .inp:focus { border-color: #71717a; }
    .send { font-family: 'DM Mono', monospace; font-size: 12px; color: #18181b; background: #e4e4e7; border: none; border-radius: 7px; padding: 11px 18px; cursor: pointer; letter-spacing: .04em; transition: opacity .15s; }
    .send:disabled { opacity: .2; cursor: default; }
    .send:hover:not(:disabled) { opacity: .8; }
    .err { font-size: 11px; color: #f87171; margin-bottom: 14px; letter-spacing: .04em; }

    .meta { display: flex; gap: 18px; margin-bottom: 20px; font-size: 11px; color: #52525b; letter-spacing: .06em; text-transform: uppercase; }
    .meta strong { color: #a1a1aa; font-weight: 500; }

    .hints-panel { background: #1f1f23; border: 1px solid #2d2d30; border-radius: 8px; padding: 14px 16px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
    .hint-meta { font-size: 10px; color: #3f3f46; letter-spacing: .06em; text-transform: uppercase; margin-bottom: -4px; }
    .hint-row { display: flex; align-items: center; gap: 10px; }
    .hint-trigger { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #71717a; background: none; border: 1px solid #3f3f46; border-radius: 5px; padding: 5px 10px; cursor: pointer; transition: color .15s, border-color .15s; white-space: nowrap; }
    .hint-trigger:hover { color: #e4e4e7; border-color: #71717a; }
    .hint-val { font-size: 11px; color: #a1a1aa; letter-spacing: .04em; line-height: 1.5; animation: fi .2s ease; }
    .hint-val strong { color: #e4e4e7; }

    .bar { height: 1.5px; background: #27272a; border-radius: 99px; margin-bottom: 28px; }
    .bar-fill { height: 100%; background: #71717a; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

    .col-heads { display: grid; grid-template-columns: 20px 1fr 56px 88px; gap: 10px; padding: 0 2px 8px; font-size: 9px; color: #3f3f46; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid #27272a; margin-bottom: 4px; }
    .row { display: grid; grid-template-columns: 20px 1fr 56px 88px; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid #1f1f23; animation: fi .2s ease; }
    @keyframes fi { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    .r-num { font-size: 10px; color: #3f3f46; text-align: center; }
    .r-word { font-size: 13px; font-weight: 500; color: #e4e4e7; letter-spacing: .02em; }
    .r-score { font-size: 13px; font-weight: 500; text-align: right; }
    .r-lbl { font-size: 10px; color: #52525b; text-align: right; letter-spacing: .06em; }

    .empty { padding: 48px 0; text-align: center; font-size: 11px; color: #3f3f46; letter-spacing: .1em; text-transform: uppercase; }

    .win { background: #1f1f23; border: 1px solid #2d2d30; border-radius: 10px; padding: 36px 28px; text-align: center; margin-bottom: 28px; animation: fi .35s ease; }
    .win-eyebrow { font-size: 10px; color: #52525b; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
    .win-word { font-family: 'DM Serif Display', serif; font-size: 56px; letter-spacing: -1px; color: #f4f4f5; line-height: 1; margin-bottom: 6px; }
    .win-cat { font-size: 11px; color: #52525b; letter-spacing: .08em; margin-bottom: 28px; }
    .win-rule { height: 1px; background: #27272a; margin-bottom: 24px; }
    .win-stats { display: flex; justify-content: center; gap: 48px; margin-bottom: 28px; }
    .ws-label { font-size: 10px; color: #52525b; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
    .ws-val { font-family: 'DM Serif Display', serif; font-size: 36px; color: #f4f4f5; }
    .play-again { font-family: 'DM Mono', monospace; font-size: 11px; color: #e4e4e7; background: none; border: 1px solid #3f3f46; border-radius: 7px; padding: 9px 22px; cursor: pointer; letter-spacing: .08em; text-transform: uppercase; transition: background .15s, border-color .15s; }
    .play-again:hover { background: #27272a; border-color: #71717a; }
  </style>
</head>

// normaliza texto (remove acentos, minúsculas)
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g,"").trim();
}

// Calcula score de similaridade 0-1000
function calcScore(guess, secretWord, secretData) {
  const g = norm(guess);
  const s = norm(secretWord);
  if (g === s) return 1000;

  // verifica se o guess é sinônimo direto (está nos primeiros neighbors)
  const neighbors = secretData.neighbors || [];
  const normNeighbors = neighbors.map(n => norm(n));
  const idx = normNeighbors.indexOf(g);

  if (idx === -1) {
    // tenta encontrar similaridade parcial como palavra contida
    let partialScore = 0;
    if (s.includes(g) || g.includes(s)) partialScore = Math.max(partialScore, 400);
    // verifica contra todos os banks de palavras
    for (const [wKey, wData] of Object.entries(WORDS)) {
      const wNorm = norm(wKey);
      const wNeighbors = (wData.neighbors || []).map(n => norm(n));
      if (wNorm === g) {
        // g é uma palavra conhecida — verifica se s está nos neighbors de g
        const sInG = wNeighbors.indexOf(s);
        if (sInG !== -1) {
          const sc = Math.max(50, 700 - sInG * 22);
          partialScore = Math.max(partialScore, sc);
        }
      }
    }
    return partialScore > 0 ? Math.min(999, partialScore) : Math.floor(Math.random() * 80 + 10);
  }

  // Mapeia índice para score:
  // 0-2   → 950-990 (quase sinônimo)
  // 3-6   → 850-940
  // 7-14  → 650-840
  // 15-24 → 400-640
  // 25+   → 150-390
  const total = neighbors.length;
  const ratio = idx / total;
  let score;
  if (idx <= 2)       score = 990 - idx * 15;
  else if (idx <= 6)  score = 940 - (idx - 3) * 22;
  else if (idx <= 14) score = 840 - (idx - 7) * 24;
  else if (idx <= 24) score = 630 - (idx - 15) * 23;
  else                score = 400 - (idx - 25) * 10;
  return Math.max(10, Math.min(999, score));
}

// Pega palavra aleatória por dificuldade
function pickWord(difficulty) {
  const keys = Object.keys(WORDS);
  // shuffle sementes
  let idx = Math.floor(Math.random() * keys.length);
  // dificil: prefere palavras mais incomuns (parte de trás do array)
  if (difficulty === "dificil") idx = Math.floor(Math.random() * keys.length * 0.4 + keys.length * 0.6) % keys.length;
  if (difficulty === "facil") idx = Math.floor(Math.random() * keys.length * 0.5);
  const key = keys[idx];
  return { word: key, ...WORDS[key] };
}

// ─────────────────────────────────────────────
// UI
// ─────────────────────────────────────────────
const DIFFICULTY = {
  facil:  { label:"Fácil",   desc:"Categoria + primeira letra + número de letras", color:"#4ade80" },
  medio:  { label:"Médio",   desc:"Categoria + número de letras",                   color:"#facc15" },
  dificil:{ label:"Difícil", desc:"Apenas categoria disponível",                    color:"#f87171" },
};

function scoreColor(s) {
  if (s >= 900) return "#4ade80";
  if (s >= 700) return "#facc15";
  if (s >= 400) return "#fb923c";
  return "#64748b";
}
function scoreLabel(s) {
  if (s === 1000) return "exato";
  if (s >= 900) return "muito quente";
  if (s >= 700) return "quente";
  if (s >= 400) return "morno";
  if (s >= 100) return "frio";
  return "gelado";
}

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) Object.entries(props).forEach(([k,v]) => {
    if (k === "className") el.className = v;
    else if (k === "style") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => c != null && el.append(typeof c === "string" ? c : c));
  return el;
}

// ─── State ───
let state = {
  phase: "select",        // select | playing | won
  difficulty: null,
  secret: null,
  guesses: [],
  error: "",
  showCatHint: false,
  showWordHint: false,
  hintUsed: false,
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ─── Render ───
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const { phase, difficulty, secret, guesses, error, showCatHint, showWordHint, hintUsed } = state;
  const diff = difficulty ? DIFFICULTY[difficulty] : null;
  const best = guesses.length ? guesses[0].score : 0;

  // Header
  const headerRight = h("div", {className:"header-right"});
  if (diff) {
    headerRight.append(h("span", {
      className:"diff-badge",
      style:{ color: diff.color, borderColor: diff.color + "44" }
    }, diff.label));
  }
  if (phase !== "select") {
    const nb = h("button", {className:"new-btn"}, "Novo jogo");
    nb.onclick = () => setState({ phase:"select", difficulty:null, secret:null, guesses:[], error:"", showCatHint:false, showWordHint:false, hintUsed:false });
    headerRight.append(nb);
  }

  const header = h("div", {className:"header"},
    h("div", {className:"title"}, "Contexto", h("em", null, ".")),
    headerRight
  );

  const body = h("div", {className:"body"});

  // ── Select ──
  if (phase === "select") {
    const cards = h("div", {className:"diff-cards"});
    Object.entries(DIFFICULTY).forEach(([key, d]) => {
      const card = h("div", {className:"diff-card"},
        h("div", null,
          h("div", {className:"dc-name", style:{color:d.color}}, d.label),
          h("div", {className:"dc-desc"}, d.desc)
        ),
        h("div", {className:"dc-arrow"}, "›")
      );
      card.onclick = () => {
        const s = pickWord(key);
        setState({ phase:"playing", difficulty:key, secret:s, guesses:[], error:"", showCatHint:false, showWordHint:false, hintUsed:false });
        setTimeout(() => document.querySelector(".inp")?.focus(), 50);
      };
      cards.append(card);
    });
    body.append(
      h("div", {className:"select-screen"},
        h("div", {className:"select-title"}, "Escolha a dificuldade"),
        h("div", {className:"select-sub"}, "Isso define quais dicas estarão disponíveis"),
        cards
      )
    );
  }

  // ── Playing ──
  if (phase === "playing" || phase === "won") {

    // Win banner
    if (phase === "won") {
      const pa = h("button", {className:"play-again"}, "Jogar novamente");
      pa.onclick = () => setState({ phase:"select", difficulty:null, secret:null, guesses:[], error:"", showCatHint:false, showWordHint:false, hintUsed:false });

      const stats = h("div", {className:"win-stats"},
        h("div", null,
          h("div", {className:"ws-label"}, "Tentativas"),
          h("div", {className:"ws-val"}, String(guesses.length))
        )
      );
      if (hintUsed) {
        stats.append(h("div", null,
          h("div", {className:"ws-label"}, "Dica usada"),
          h("div", {className:"ws-val", style:{fontSize:"22px",paddingTop:"8px"}}, "sim")
        ));
      }

      body.append(h("div", {className:"win"},
        h("div", {className:"win-eyebrow"}, "Palavra encontrada"),
        h("div", {className:"win-word"}, secret.word),
        h("div", {className:"win-cat"}, secret.cat + " · " + diff.label),
        h("div", {className:"win-rule"}),
        stats,
        pa
      ));
    }

    // Input
    if (phase === "playing") {
      const inp = h("input", {className:"inp", type:"text", placeholder:"Digite uma palavra...", autocomplete:"off", autocorrect:"off", spellcheck:"false"});
      const send = h("button", {className:"send"}, "Tentar");

      const doSubmit = () => {
        const word = inp.value.trim().toLowerCase();
        if (!word) return;
        if (state.guesses.find(g => norm(g.word) === norm(word))) {
          setState({error:"Já tentada."}); return;
        }
        const score = calcScore(word, secret.word, WORDS[secret.word] || secret);
        const next = [...state.guesses, {word, score}].sort((a,b) => b.score - a.score);
        inp.value = "";
        setState({ guesses: next, error: "", phase: score === 1000 ? "won" : "playing" });
        setTimeout(() => document.querySelector(".inp")?.focus(), 50);
      };

      inp.onkeydown = e => e.key === "Enter" && doSubmit();
      send.onclick = doSubmit;

      body.append(h("div", {className:"input-row"}, inp, send));
      if (error) body.append(h("div", {className:"err"}, error));

      // Meta
      const meta = h("div", {className:"meta"},
        h("span", null, String(guesses.length), " ", h("strong", null, guesses.length !== 1 ? "tentativas" : "tentativa"))
      );
      if (best > 0) {
        const sp = document.createElement("span");
        sp.innerHTML = `melhor <strong>${best}</strong>`;
        meta.append(sp);
      }
      body.append(meta);

      // Hints panel
      const hintsPanel = h("div", {className:"hints-panel"},
        h("div", {className:"hint-meta"}, "Dicas disponíveis")
      );

      // Cat hint
      const catRow = h("div", {className:"hint-row"});
      const catBtn = h("button", {className:"hint-trigger"}, showCatHint ? "Ocultar" : "Categoria");
      catBtn.onclick = () => setState({showCatHint: !state.showCatHint});
      catRow.append(catBtn);
      if (showCatHint) {
        let hintText = secret.cat;
        if (difficulty === "facil" || difficulty === "medio") hintText += ` · ${secret.word.length} letras`;
        if (difficulty === "facil") hintText += ` · começa com "${secret.word[0].toUpperCase()}"`;
        const hv = h("span", {className:"hint-val"});
        hv.innerHTML = hintText.replace(/·/g, "·").replace(/"([^"]+)"/g, '"<strong>$1</strong>"').replace(/(\d+) letras/, '<strong>$1</strong> letras');
        catRow.append(hv);
      }
      hintsPanel.append(catRow);

      // Word hint
      const wordRow = h("div", {className:"hint-row"});
      const wordBtn = h("button", {className:"hint-trigger"}, showWordHint ? "Ocultar dica" : "Dica da palavra");
      wordBtn.onclick = () => {
        setState({ showWordHint: !state.showWordHint, hintUsed: true });
      };
      wordRow.append(wordBtn);
      if (showWordHint && secret.hint) {
        wordRow.append(h("span", {className:"hint-val"}, secret.hint));
      }
      hintsPanel.append(wordRow);

      body.append(hintsPanel);

      // Progress bar
      if (guesses.length > 0) {
        body.append(h("div", {className:"bar"},
          h("div", {className:"bar-fill", style:{width:`${best/10}%`}})
        ));
      }
    }

    // Guess list
    if (guesses.length > 0) {
      const colHeads = h("div", {className:"col-heads"},
        h("div"),
        h("div", null, "Palavra"),
        h("div", {style:{textAlign:"right"}}, "Score"),
        h("div", {style:{textAlign:"right"}}, "Temperatura")
      );
      body.append(colHeads);

      guesses.forEach((g, i) => {
        const row = h("div", {className:"row"},
          h("div", {className:"r-num"}, String(i+1)),
          h("div", {className:"r-word"}, g.word),
          h("div", {className:"r-score", style:{color:scoreColor(g.score)}}, String(g.score)),
          h("div", {className:"r-lbl"}, scoreLabel(g.score))
        );
        body.append(row);
      });
    }

    if (guesses.length === 0 && phase === "playing") {
      body.append(h("div", {className:"empty"}, "Faça sua primeira tentativa"));
    }
  }

  app.append(header, body);
}

render();
</script>
